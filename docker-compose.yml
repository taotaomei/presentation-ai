services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: presentation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: presentation
      POSTGRES_PASSWORD: presentation_password
      POSTGRES_DB: presentation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - presentation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presentation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presentation-app
    restart: unless-stopped
    ports:
      - "8030:8030"
    environment:
      # 数据库连接
      DATABASE_URL: "postgresql://presentation:presentation_password@postgres:5432/presentation_db"
      
      # NextAuth 配置
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-your-secret-key-change-this-in-production}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:8030}"
      
      # Google OAuth (需要配置)
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      
      # API Keys
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      TOGETHER_AI_API_KEY: "${TOGETHER_AI_API_KEY}"
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
      UNSPLASH_ACCESS_KEY: "${UNSPLASH_ACCESS_KEY}"
      UPLOADTHING_TOKEN: "${UPLOADTHING_TOKEN}"
      
      # 应用配置
      NODE_ENV: production
      PORT: 8030
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - presentation-network
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
    driver: local

networks:
  presentation-network:
    driver: bridge
